<!DOCTYPE html>
<html lang="en">
<head><meta charset="utf-8"><title>Compose — Mailstead</title></head>
<body>
  <h1>Compose</h1>
  {% if messages %}{% for m in messages %}<p>{{ m }}</p>{% endfor %}{% endif %}
  <form method="post">
    {% csrf_token %}
    <p>From: <input name="from" value="{{ mailbox.address }}"></p>
    <p>To: <input name="to" size="60"></p>
    <p>Subject: <input name="subject" value="{{ prefill|default:'' }}"></p>
    <textarea name="body" rows="12" cols="80"></textarea>
    <p><button type="submit">Send</button></p>
  </form>
</body>
</html>
