{% load static %}
{% if brand_nolink %}
<div class="app-brand app-brand--static">
{% else %}
<a class="app-brand" href="{{ brand_href|default:'/' }}">
{% endif %}
  <img
    class="app-brand-icon"
    src="{% static 'mailstead/icon-180.png' %}"
    width="32"
    height="32"
    alt=""
    decoding="async"
  >
  <span class="app-brand-text">
    {% if brand_title %}{{ brand_title }}{% else %}Mailstead{% if mail_domain %}<span class="app-brand-sub"> · {{ mail_domain }}</span>{% endif %}{% endif %}
  </span>
{% if brand_nolink %}
</div>
{% else %}
</a>
{% endif %}
