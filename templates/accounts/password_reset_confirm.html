{% extends "base.html" %}
{% block title %}Set new password — Mailstead{% endblock %}
{% block body_class %}auth-page{% endblock %}
{% block header %}
{% include "partials/auth_header.html" %}
{% endblock %}
{% block body %}
<main class="app-main">
  <div class="auth-card card">
    <h1>Set new password</h1>
    <form method="post">
      {% csrf_token %}
      {{ form.as_p }}
      <button type="submit" class="btn btn-primary btn-block">Save password</button>
    </form>
  </div>
</main>
{% endblock %}
